<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }}</title>
    <meta name="description" content="Founder @ Hexmos">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4efe7;
            --bg-accent: #e4d3bf;
            --surface: rgba(255, 251, 246, 0.9);
            --surface-strong: rgba(255, 255, 255, 0.94);
            --text: #171411;
            --muted: #665a4f;
            --line: rgba(23, 20, 17, 0.1);
            --primary: #a34c2d;
            --primary-dark: #7f341b;
            --shadow: 0 24px 70px rgba(83, 51, 24, 0.14);
            --radius-xl: 32px;
            --radius-lg: 22px;
            --radius-md: 16px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 34%),
                radial-gradient(circle at right 18%, rgba(163, 76, 45, 0.16), transparent 20%),
                linear-gradient(140deg, #f8f2e9 0%, #ede0ce 52%, #e5d1bb 100%);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 999px;
            pointer-events: none;
            filter: blur(28px);
            opacity: 0.45;
        }

        body::before {
            top: -10rem;
            right: -8rem;
            width: 24rem;
            height: 24rem;
            background: rgba(255, 226, 190, 0.9);
        }

        body::after {
            left: -6rem;
            bottom: -8rem;
            width: 22rem;
            height: 22rem;
            background: rgba(163, 76, 45, 0.14);
        }

        .page {
            position: relative;
            z-index: 1;
            width: min(960px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 32px 0 56px;
        }

        .shell {
            overflow: hidden;
            border-radius: 38px;
            border: 1px solid rgba(255,255,255,0.65);
            background: linear-gradient(180deg, rgba(255,255,255,0.5), rgba(255,255,255,0.2));
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .shell-inner {
            padding: 28px;
        }

        .hero {
            padding: 24px;
            border-radius: var(--radius-xl);
            background: linear-gradient(180deg, rgba(255,255,255,0.52), rgba(255,255,255,0.08));
            border: 1px solid rgba(255,255,255,0.48);
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(255, 251, 246, 0.85);
            color: var(--primary-dark);
            border: 1px solid rgba(163, 76, 45, 0.18);
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: var(--primary);
            box-shadow: 0 0 0 6px rgba(163, 76, 45, 0.12);
        }

        h1 {
            margin: 20px 0 12px;
            font-family: "Fraunces", serif;
            font-size: clamp(3.4rem, 11vw, 5.6rem);
            line-height: 0.94;
            letter-spacing: -0.05em;
        }

        .subtitle {
            max-width: 40rem;
            margin: 0;
            color: var(--muted);
            font-size: 1.05rem;
            line-height: 1.8;
        }

        .subtitle p {
            margin: 0;
        }

        .subtitle a {
            color: var(--primary-dark);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid rgba(127, 52, 27, 0.24);
        }

        .subtitle a:hover {
            border-bottom-color: rgba(127, 52, 27, 0.6);
        }

        .entries {
            margin-top: 24px;
            display: grid;
            gap: 16px;
        }

        .entry {
            display: grid;
            gap: 10px;
            padding: 22px;
            border-radius: var(--radius-lg);
            background: var(--surface-strong);
            border: 1px solid var(--line);
            color: inherit;
            text-decoration: none;
            transition: transform 160ms ease, box-shadow 160ms ease, border-color 160ms ease;
        }

        .entry:hover {
            transform: translateY(-2px);
            border-color: rgba(163, 76, 45, 0.22);
            box-shadow: 0 18px 34px rgba(83, 51, 24, 0.08);
        }

        .entry-label {
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--primary-dark);
        }

        .entry-title {
            font-family: "Fraunces", serif;
            font-size: clamp(1.55rem, 4vw, 2.2rem);
            line-height: 1.08;
            letter-spacing: -0.03em;
        }

        .entry-copy {
            color: var(--muted);
            line-height: 1.7;
        }

        .entry-arrow {
            color: var(--primary);
            font-weight: 800;
        }

        @media (max-width: 640px) {
            .page {
                width: min(100vw - 16px, 960px);
                padding: 12px 0 24px;
            }

            .shell-inner,
            .hero,
            .entry {
                padding: 20px;
            }

            .shell {
                border-radius: 24px;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="shell">
            <div class="shell-inner">
                <section class="hero">
                    <span class="eyebrow">Personal Site</span>
                    <h1>{{ .Title }}</h1>
                    <div class="subtitle">{{ .Content }}</div>
                </section>

                <section class="entries" aria-label="Site entry points">
                    <a class="entry" href='{{ "/rebuilding-git-from-scratch-with-ai-an-intuition-first-approach/" | relURL }}'>
                        <span class="entry-label">Featured</span>
                        <span class="entry-title">Rebuilding Git From Scratch with AI: An Intuition-First Approach</span>
                        <span class="entry-copy">A focused landing page for the new release.</span>
                        <span class="entry-arrow">Open page →</span>
                    </a>

                    <a class="entry" href='{{ "/post/" | relURL }}'>
                        <span class="entry-label">Archive</span>
                        <span class="entry-title">Archived Posts of existing things</span>
                        <span class="entry-copy">Browse the existing writing archive published on the site.</span>
                        <span class="entry-arrow">View archive →</span>
                    </a>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
